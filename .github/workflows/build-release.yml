name: Build and Release CE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  SCHEME: DeliciousIsland
  APP_NAME: Delicious Island
  BUNDLE_ID: com.grokr.DeliciousIsland

jobs:
  build:
    name: Build, Sign, Notarize & Release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=${GIT_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Developer ID Certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build and Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -archivePath build/DeliciousIsland.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          echo '<?xml version="1.0" encoding="UTF-8"?>' > build/ExportOptions.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> build/ExportOptions.plist
          echo '<plist version="1.0">' >> build/ExportOptions.plist
          echo '<dict>' >> build/ExportOptions.plist
          echo '    <key>method</key>' >> build/ExportOptions.plist
          echo '    <string>developer-id</string>' >> build/ExportOptions.plist
          echo '    <key>teamID</key>' >> build/ExportOptions.plist
          echo "    <string>$APPLE_TEAM_ID</string>" >> build/ExportOptions.plist
          echo '    <key>signingStyle</key>' >> build/ExportOptions.plist
          echo '    <string>manual</string>' >> build/ExportOptions.plist
          echo '    <key>signingCertificate</key>' >> build/ExportOptions.plist
          echo '    <string>Developer ID Application</string>' >> build/ExportOptions.plist
          echo '</dict>' >> build/ExportOptions.plist
          echo '</plist>' >> build/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/DeliciousIsland.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Notarize App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create zip for notarization
          ditto -c -k --keepParent "build/export/$APP_NAME.app" build/app.zip

          # Submit for notarization
          xcrun notarytool submit build/app.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the ticket
          xcrun stapler staple "build/export/$APP_NAME.app"

      - name: Create DMG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p releases

          create-dmg \
            --volname "Delicious Island CE" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 200 \
            --app-drop-link 450 200 \
            --hide-extension "$APP_NAME.app" \
            "releases/DeliciousIsland-CE-$VERSION.dmg" \
            "build/export/$APP_NAME.app"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${{ steps.version.outputs.version }}

          xcrun notarytool submit "releases/DeliciousIsland-CE-$VERSION.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "releases/DeliciousIsland-CE-$VERSION.dmg"

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.version }}

          if [ -f CHANGELOG.md ]; then
            NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1 | tail -n +2)

            if [ -n "$NOTES" ]; then
              echo "$NOTES" > $RUNNER_TEMP/release_notes.md
              echo "notes_file=$RUNNER_TEMP/release_notes.md" >> $GITHUB_OUTPUT
              echo "has_notes=true" >> $GITHUB_OUTPUT
            else
              echo "has_notes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DMG_PATH="releases/DeliciousIsland-CE-$VERSION.dmg"

          # Build release notes file
          echo "## Delicious Island Community Edition v$VERSION" > $RUNNER_TEMP/release_body.md
          echo "" >> $RUNNER_TEMP/release_body.md
          echo "### Installation" >> $RUNNER_TEMP/release_body.md
          echo "1. Download the DMG file below" >> $RUNNER_TEMP/release_body.md
          echo "2. Open the DMG and drag Delicious Island to Applications" >> $RUNNER_TEMP/release_body.md
          echo "3. Launch from Applications" >> $RUNNER_TEMP/release_body.md
          echo "" >> $RUNNER_TEMP/release_body.md
          echo "### Premium Features" >> $RUNNER_TEMP/release_body.md
          echo "Want MCP Task Router, Tmux Integration, and Auto-Updates?" >> $RUNNER_TEMP/release_body.md
          echo "Check out [Delicious Island Premium](https://grokr-labs.com/delicious-island)" >> $RUNNER_TEMP/release_body.md

          if [ -f "$RUNNER_TEMP/release_notes.md" ]; then
            echo "" >> $RUNNER_TEMP/release_body.md
            echo "### Changes" >> $RUNNER_TEMP/release_body.md
            cat $RUNNER_TEMP/release_notes.md >> $RUNNER_TEMP/release_body.md
          fi

          # Create release with DMG
          gh release create "v$VERSION" \
            --title "Delicious Island CE v$VERSION" \
            --notes-file $RUNNER_TEMP/release_body.md \
            "$DMG_PATH"

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
