name: Build and Release CE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SCHEME: DeliciousIsland
  APP_NAME: Delicious Island
  BUNDLE_ID: com.grokr.DeliciousIsland

jobs:
  build:
    name: Build, Sign, Notarize & Release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Developer ID Certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build and Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -archivePath build/DeliciousIsland.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/DeliciousIsland.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Notarize App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create zip for notarization
          ditto -c -k --keepParent "build/export/$APP_NAME.app" build/app.zip

          # Submit for notarization
          xcrun notarytool submit build/app.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the ticket
          xcrun stapler staple "build/export/$APP_NAME.app"

      - name: Create DMG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p releases

          create-dmg \
            --volname "Delicious Island CE" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 200 \
            --app-drop-link 450 200 \
            --hide-extension "$APP_NAME.app" \
            "releases/DeliciousIsland-CE-$VERSION.dmg" \
            "build/export/$APP_NAME.app"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${{ steps.version.outputs.version }}

          xcrun notarytool submit "releases/DeliciousIsland-CE-$VERSION.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "releases/DeliciousIsland-CE-$VERSION.dmg"

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.version }}

          if [ -f CHANGELOG.md ]; then
            NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1 | tail -n +2)

            if [ -n "$NOTES" ]; then
              echo "$NOTES" > $RUNNER_TEMP/release_notes.md
              echo "notes_file=$RUNNER_TEMP/release_notes.md" >> $GITHUB_OUTPUT
              echo "has_notes=true" >> $GITHUB_OUTPUT
            else
              echo "has_notes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DMG_PATH="releases/DeliciousIsland-CE-$VERSION.dmg"

          # Build release notes
          RELEASE_NOTES="## Delicious Island Community Edition v$VERSION

          ### Installation
          1. Download the DMG file below
          2. Open the DMG and drag Delicious Island to Applications
          3. Launch from Applications

          ### Premium Features
          Want MCP Task Router, Tmux Integration, and Auto-Updates?
          Check out [Delicious Island Premium](https://grokr-labs.com/delicious-island)"

          if [ -f "$RUNNER_TEMP/release_notes.md" ]; then
            RELEASE_NOTES="$RELEASE_NOTES

          ### Changes
          $(cat $RUNNER_TEMP/release_notes.md)"
          fi

          # Create release with DMG
          echo "$RELEASE_NOTES" | gh release create "v$VERSION" \
            --title "Delicious Island CE v$VERSION" \
            --notes-file - \
            "$DMG_PATH"

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
