<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Island</title>
    <meta http-equiv="refresh" content="0; url=https://github.com/Grokr-Labs/delicious-island-pe">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            opacity: 0.8;
            margin-bottom: 2rem;
        }
        a {
            color: #d97756;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 2px solid #d97756;
            border-radius: 8px;
            transition: all 0.2s;
        }
        a:hover {
            background: #d97756;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Delicious Island</h1>
        <p>Dynamic Island-style notifications for Claude Code CLI</p>
        <a href="https://github.com/Grokr-Labs/delicious-island-pe">View on GitHub</a>
    </div>
</body>
</html>
